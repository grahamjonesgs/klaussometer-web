<!DOCTYPE html>
<html>

<head>
    <title>Home Stats</title>
    <style type="text/css">
        .nav-button {
            display: inline-block;
            padding: 10px 20px;
            margin: 10px;
            background-color: #007bff;
            color: white;
            text-align: center;
            text-decoration: none;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        .nav-button:hover {
            background-color: #0056b3;
        }
        
        body {
            font-family: Arial, sans-serif;
            background-color: #eef2f5;
            padding: 20px;
        }

        .dashboard-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .room-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            padding: 30px;
            text-align: center;
            min-width: 250px;
            flex: 1;
        }

        .solar-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .solar-card h2 {
            color: white;
            border-bottom-color: rgba(255,255,255,0.3);
        }

        .solar-card .stat-label,
        .solar-card .stat-value {
            color: white;
        }

        .room-card h2 {
            margin: 0 0 10px;
            font-size: 1.5rem;
            color: #333;
        }

        .value-display {
            display: inline-block;
        }

        .temp-value,
        .humidity-value,
        .power-value {
            font-size: 3rem;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }

        .humidity-value {
            color: #28a745;
        }

        .power-value {
            color: #ffd700;
        }

        .unit {
            font-size: 1.5rem;
            font-weight: normal;
            color: #666;
            margin-left: 5px;
        }

        .solar-card .unit {
            color: rgba(255,255,255,0.9);
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        .solar-card .stat-row {
            border-bottom-color: rgba(255,255,255,0.2);
        }

        .stat-row:last-child {
            border-bottom: none;
        }

        .stat-label {
            font-weight: bold;
            color: #555;
        }

        .stat-value {
            color: #333;
        }

        @keyframes flash-animation {
            0% { background-color: transparent; }
            50% { background-color: yellow; }
            100% { background-color: transparent; }
        }

        .flash-temp {
            animation: flash-animation 1s ease-out 3;
            border-radius: 4px;
        }
        
        .flash-humidity {
            animation: flash-animation 1s ease-out 3; 
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .room-card {
                min-width: 150px;
            }

            .temp-value,
            .humidity-value,
            .power-value {
                font-size: 2rem;
            }

            .unit {
                font-size: 1rem;
            }
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
    <script src="../js/config.js"></script> 

    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
</head>

<body>
    <a href="graph.html" class="nav-button">View Graph</a>
    <button onclick="refreshAll()" class="nav-button">Refresh Now</button>
    <a href="system_status.php" class="nav-button">System Status</a>
    
    <h2 style="text-align: center; color: #333; margin-top: 20px;">Temperature & Humidity</h2>
    <div id="dashboard-container" class="dashboard-container"></div>
    
    <h2 style="text-align: center; color: #333; margin-top: 40px;">Solar & Power</h2>
    <div id="solar-container" class="dashboard-container"></div>
    
    <p id="last-updated-time" style="text-align: center; font-style: italic; color: #666;"></p>

    <script>
        let previousRoomData = {}; 

        $(document).ready(function() {
            refreshAll();
            setInterval(refreshAll, 30000);
        });

        function refreshAll() {
            showCurrent();
            showSolar();
        }

        function showCurrent() {
            // Show loading indicator
            if ($('#dashboard-container .room-card').length === 0) {
                $('#dashboard-container').append('<div class="room-card" id="sensor-loading"><p>Loading sensors...</p></div>');
            }
            
            $.get("latest.php", function(data) {
                $('#sensor-loading').remove();
                var dataJSON = JSON.parse(data);
                var currentRoomData = {};

                if (dataJSON.length > 0) {
                    dataJSON.forEach(function(item) {
                        var room_id = item.room_id;
                        var type = item.type;
                        var value = item.value;

                        if (!currentRoomData[room_id]) {
                            currentRoomData[room_id] = {
                                temp: '--',
                                humidity: '--'
                            };
                        }
                        
                        if (type === 'tempset-ambient') {
                            currentRoomData[room_id].temp = parseFloat(value).toFixed(1);
                        } else if (type === 'tempset-humidity') {
                            currentRoomData[room_id].humidity = parseFloat(value).toFixed(0);
                        }
                    });

                    var dashboardContainer = $('#dashboard-container');
                    // Clear all room cards (not solar cards - they're in different container now)
                    dashboardContainer.empty();

                    for (var room_id in currentRoomData) {
                        if (currentRoomData.hasOwnProperty(room_id)) {
                            var displayName = (typeof roomMap !== 'undefined' && roomMap[room_id]) ? roomMap[room_id] : room_id;

                            const newTemp = currentRoomData[room_id].temp;
                            const newHumidity = currentRoomData[room_id].humidity;
                            const oldTemp = previousRoomData[room_id] ? previousRoomData[room_id].temp : null;
                            const oldHumidity = previousRoomData[room_id] ? previousRoomData[room_id].humidity : null;

                            const tempClass = (newTemp !== oldTemp && oldTemp !== null) ? 'flash-temp' : '';
                            const humidityClass = (newHumidity !== oldHumidity && oldHumidity !== null) ? 'flash-humidity' : '';

                            var $card = $('<div>')
                                .addClass('room-card')
                                .attr('data-room-id', room_id);

                            var $title = $('<h2>').text(displayName);

                            var $tempPara = $('<p>');
                            var $tempValue = $('<span>')
                                .addClass('value-display temp-value ' + tempClass)
                                .attr('id', 'temp-' + room_id)
                                .text(newTemp);
                            var $tempUnit = $('<span>').addClass('unit').html('&#8451;');
                            $tempPara.append($tempValue, $tempUnit);

                            var $humidityPara = $('<p>');
                            var $humidityValue = $('<span>')
                                .addClass('value-display humidity-value ' + humidityClass)
                                .attr('id', 'humidity-' + room_id)
                                .text(newHumidity);
                            var $humidityUnit = $('<span>').addClass('unit').text('%');
                            $humidityPara.append($humidityValue, $humidityUnit);

                            $card.append($title, $tempPara, $humidityPara);
                            dashboardContainer.append($card);
                        }
                    }

                    previousRoomData = currentRoomData;
                    
                    setTimeout(() => {
                        $('.flash-temp, .flash-humidity').removeClass('flash-temp flash-humidity');
                    }, 3000);

                    updateTimestamp();

                } else {
                    $('#dashboard-container').html('<p style="text-align:center;color:#666;">No sensor data available</p>');
                    updateTimestamp('(No data)');
                }
            }).fail(function() {
                $('#sensor-loading').remove();
                console.error('Failed to load sensor data');
            });
        }

        function showSolar() {
            // Show loading indicator for solar
            if ($('#solar-container .solar-card').length === 0) {
                var $loadingCard = $('<div>')
                    .addClass('room-card solar-card')
                    .attr('id', 'solar-loading')
                    .html('<h2>Generation</h2><p>Loading...</p>');
                $('#solar-container').append($loadingCard);
            }
            
            $.get("solar.php", function(data) {
                $('#solar-loading').remove();
                var solarData = typeof data === 'string' ? JSON.parse(data) : data;
                
                // Remove existing solar cards
                $('#solar-container').empty();
                
                if (solarData.error) {
                    console.error('Solar data error:', solarData.error);
                    return;
                }

                var solarContainer = $('#solar-container');

                // Main solar card - Current Power
                var $solarCard = $('<div>')
                    .addClass('room-card solar-card')
                    .attr('data-type', 'solar-main');

                var $title = $('<h2>').html('Generation');

                var $powerPara = $('<p>');
                var $powerValue = $('<span>')
                    .addClass('value-display power-value')
                    .text((solarData.current_power / 1000).toFixed(2));
                var $powerUnit = $('<span>').addClass('unit').text('kW');
                $powerPara.append($powerValue, $powerUnit);

                $solarCard.append($title, $powerPara);

                // Battery card (if available)
                if (solarData.battery_soc !== null && solarData.battery_soc !== undefined) {
                    var $batteryCard = $('<div>')
                        .addClass('room-card solar-card')
                        .attr('data-type', 'solar-battery');

                    var $batteryTitle = $('<h2>').html('Battery');
                    
                    var $batteryPara = $('<p>');
                    var $batteryValue = $('<span>')
                        .addClass('value-display power-value')
                        .text(solarData.battery_soc.toFixed(0));
                    var $batteryUnit = $('<span>').addClass('unit').text('%');
                    $batteryPara.append($batteryValue, $batteryUnit);
                    
                    // Battery power flow
                    var $batteryFlowRow = $('<div>').addClass('stat-row');
                    var batteryFlow = (solarData.battery_power / 1000).toFixed(2);
                    var batteryDirection = solarData.battery_power < 0 ? 'Charging' : 'Discharging';
                    $batteryFlowRow.append(
                        $('<span>').addClass('stat-label').text('Power:'),
                        $('<span>').addClass('stat-value').text(Math.abs(batteryFlow) + ' kW ' + batteryDirection)
                    );

                    $batteryCard.append($batteryTitle, $batteryPara, $batteryFlowRow);
                    solarContainer.append($batteryCard);
                }

                // Using card
                if (solarData.using_power !== null && solarData.using_power !== undefined) {
                    var $usingCard = $('<div>')
                        .addClass('room-card solar-card')
                        .attr('data-type', 'solar-grid');

                    var $usingTitle = $('<h2>').html('House usage');
                    
                    var usingPowerKW = (solarData.using_power / 1000).toFixed(2);

                    var $usingPara = $('<p>');
                    var $usingValue = $('<span>')
                        .addClass('value-display power-value')
                        .text(Math.abs(usingPowerKW));
                    var $usingUnit = $('<span>').addClass('unit').text('kW');
                    $usingPara.append($usingValue, $usingUnit);
                    
                    var $usingFlowRow = $('<div>').addClass('stat-row');
                    $usingFlowRow.append(
                        $('<span>').addClass('stat-label').text(''),
                    );

                    $usingCard.append($usingTitle, $usingPara, $usingFlowRow);
                    solarContainer.append($usingCard);
                }


                // Grid card
                if (solarData.grid_power !== null && solarData.grid_power !== undefined) {
                    var $gridCard = $('<div>')
                        .addClass('room-card solar-card')
                        .attr('data-type', 'solar-grid');

                    var $gridTitle = $('<h2>').html('Grid usage');
                    
                    var gridPowerKW = (solarData.grid_power / 1000).toFixed(2);

                    var $gridPara = $('<p>');
                    var $gridValue = $('<span>')
                        .addClass('value-display power-value')
                        .text(Math.abs(gridPowerKW));
                    var $gridUnit = $('<span>').addClass('unit').text('kW');
                    $gridPara.append($gridValue, $gridUnit);
                    
                    var $gridFlowRow = $('<div>').addClass('stat-row');
                    $gridFlowRow.append(
                        $('<span>').addClass('stat-label').text(''),
                    );

                    $gridCard.append($gridTitle, $gridPara, $gridFlowRow);
                    solarContainer.append($gridCard);
                }

                // Add solar power card (now added last instead of first)
                solarContainer.append($solarCard);

            }).fail(function(jqXHR, textStatus, errorThrown) {
                $('#solar-loading').remove();
                console.error('Failed to load solar data:', textStatus, errorThrown);
                // Optionally show a warning card
                var $errorCard = $('<div>')
                    .addClass('room-card')
                    .css({
                        'background-color': '#fff3cd',
                        'border': '1px solid #ffc107'
                    })
                    .html('<h2>⚠️ Solar System</h2><p style="color:#856404;">Unable to load data</p>');
                $('#solar-container').append($errorCard);
            });
        }

        function updateTimestamp(suffix = '') {
            var now = new Date();
            var timeString = now.toLocaleTimeString();
            document.getElementById('last-updated-time').textContent = 'Last updated: ' + timeString + (suffix ? ' ' + suffix : '');
        }
    </script>
</body>
</html>
