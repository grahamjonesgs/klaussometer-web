<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin admin@watsonia22.com
    ServerName watsonia22.com
    ServerAlias www.watsonia22.com
    DocumentRoot /var/www/watsonia22.com
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
   
<Directory /var/www/watsonia22.com/>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

# Node-RED editor, which listens only on 127.0.0.1:1880 (uiHost and
# httpAdminRoot in ~/.node-red/settings.js). upgrade=websocket carries the
# editor's live connection (/node-red/comms).
RedirectMatch 301 ^/node-red$ /node-red/
ProxyPass        /node-red/ http://127.0.0.1:1880/node-red/ upgrade=websocket
ProxyPassReverse /node-red/ http://127.0.0.1:1880/node-red/
# Only the home ISP (RSAWEB, AS37053) can reach the editor; from elsewhere use an SSH tunnel.
# Same ranges as the rsaweb-ipv4 AWS prefix list and the firmware block in .htaccess.
<Location /node-red/>
    Require ip 41.71.0.0/17 41.74.176.0/20 41.79.36.0/22 41.79.156.0/22 41.215.232.0/21
    Require ip 41.223.32.0/22 102.206.208.0/22 102.210.136.0/22 102.212.192.0/21 102.213.64.0/22
    Require ip 102.214.92.0/22 102.215.212.0/22 102.217.28.0/22 102.217.32.0/21 102.217.40.0/22
    Require ip 102.217.76.0/22 165.0.0.0/16 196.1.130.0/24 196.46.31.0/24
</Location>

Include /etc/letsencrypt/options-ssl-apache.conf

# Set this to "Prod" to only show "Server: Apache" in headers
#ServerTokens Prod

# Turn off the server signature on error pages
#ServerSignature Off

SSLCertificateFile /etc/letsencrypt/live/watsonia22.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/watsonia22.com/privkey.pem
</VirtualHost>
</IfModule>
