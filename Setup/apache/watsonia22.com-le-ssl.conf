<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerAdmin admin@watsonia22.com
    ServerName watsonia22.com
    ServerAlias www.watsonia22.com
    DocumentRoot /var/www/watsonia22.com
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
   
<Directory /var/www/watsonia22.com/>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

Include /etc/letsencrypt/options-ssl-apache.conf

# Set this to "Prod" to only show "Server: Apache" in headers
#ServerTokens Prod

# Turn off the server signature on error pages
#ServerSignature Off

SSLCertificateFile /etc/letsencrypt/live/watsonia22.com/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/watsonia22.com/privkey.pem
</VirtualHost>
</IfModule>
