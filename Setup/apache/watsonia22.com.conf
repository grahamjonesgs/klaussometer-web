<VirtualHost *:80>
    ServerAdmin admin@watsonia22.com
    ServerName watsonia22.com
    ServerAlias www.watsonia22.com
    DocumentRoot /var/www/watsonia22.com
    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
RewriteEngine on
RewriteCond %{SERVER_NAME} =watsonia22.com [OR]
RewriteCond %{SERVER_NAME} =www.watsonia22.com
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
